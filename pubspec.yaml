name: matchmaking
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  socket_io_client: ^3.1.2

  google_maps_flutter: ^2.7.0

  flutter_typeahead: ^5.2.0
  flutter_keyboard_visibility: ^6.0.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/cards_active.png
    - assets/cards_inactive.png
    - assets/indicator_active.png
    - assets/indicator_inactive.png
    - assets/message_active.png
    - assets/message_inactive.png
    - assets/people_active.png
    - assets/people_inactive.png
    - assets/logo.png
    - assets/3d_avatar_15.png
    - assets/Vector_(Stroke).png

    - assets/3d_avatar_15.png
    - assets/Vector_(Stroke).png

